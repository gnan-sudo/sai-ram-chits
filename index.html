<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sai Ram Chits</title>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&family=Noto+Sans+Telugu:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#e8f1ef;--card:#fff;--ink:#12263a;--mut:#58708a;--line:#d3e2de;--acc:#0f7b6c;--gold:#f2b830;--bad:#c0392b;--good:#0f7b6c;--sh:0 6px 20px rgba(18,38,58,.09);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a1424;--card:#13203a;--ink:#eaf0fa;--mut:#9db0c9;--line:#243556;--acc:#3fc1ae;--bad:#ff8a80;--good:#3fc1ae;--sh:0 6px 20px rgba(0,0,0,.35)}}
:root[data-theme="dark"]{--bg:#0a1424;--card:#13203a;--ink:#eaf0fa;--mut:#9db0c9;--line:#243556;--acc:#3fc1ae;--bad:#ff8a80;--good:#3fc1ae;--sh:0 6px 20px rgba(0,0,0,.35)}
*,*:before,*:after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Archivo,"Noto Sans Telugu",system-ui,sans-serif;font-size:16px;line-height:1.55;font-variant-numeric:tabular-nums}
main{max-width:1000px;margin:0 auto;padding:12px 12px 96px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.hero{background:linear-gradient(135deg,#0b4d46 0%,#14315c 100%);color:#fff;border-radius:22px;padding:18px 20px 20px;margin-bottom:14px;box-shadow:var(--sh)}
.hero .top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:46px;height:46px;border-radius:50%;background:var(--gold);display:grid;place-items:center;font-size:24px}
h1{font-size:30px;font-weight:800;margin:0;letter-spacing:-.3px}
h2{font-size:18px;margin:0 0 12px;font-weight:800}
.sub{margin:8px 0 12px;color:rgba(255,255,255,.82)}
.ctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.hero select,.hero button{background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.35);padding:8px 12px;width:auto}
.hero select option{color:#12263a}
.badge{font-size:13px;font-weight:600;padding:3px 12px;border-radius:99px;background:var(--gold);color:#12263a}
.pt{font-weight:600;margin-bottom:8px}
.dots{display:flex;gap:6px;flex-wrap:wrap}
.dot{width:14px;height:14px;border-radius:50%;background:rgba(255,255,255,.22)}
.dot.done{background:var(--gold)}.dot.cur{background:transparent;border:2px solid var(--gold)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px;box-shadow:var(--sh)}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
label{display:block;font-size:14px;color:var(--mut);margin-bottom:4px}
input,select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}
input:focus,select:focus,button:focus-visible{outline:3px solid var(--gold);outline-offset:1px}
button{font:inherit;font-weight:600;padding:11px 18px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
button.p{background:linear-gradient(135deg,#12917f,#0b6a5d);border-color:transparent;color:#fff}
button.d{color:var(--bad)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.row.sp{justify-content:space-between}
nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
nav button{display:flex;gap:8px;align-items:center;border-radius:99px;padding:10px 18px;box-shadow:var(--sh)}
nav button i{font-style:normal}
nav button.on{background:var(--ink);color:var(--card);border-color:var(--ink)}
.stats{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--line);border-top:4px solid var(--c,var(--gold));border-radius:14px;padding:14px;box-shadow:var(--sh)}
.stat i{font-style:normal;display:grid;place-items:center;width:40px;height:40px;border-radius:50%;font-size:20px;background:color-mix(in srgb,var(--c) 16%,transparent);margin-bottom:6px}
.stat b{display:block;font-size:24px;line-height:1.2}.stat span{color:var(--mut);font-size:14px}
.stat.sm{border-top-width:1px;box-shadow:none;padding:10px 12px}.stat.sm b{font-size:20px}
.banner{background:color-mix(in srgb,var(--gold) 22%,var(--card));border:1px solid var(--gold);border-radius:14px;padding:12px 16px;margin-bottom:14px;font-weight:600}
.wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:560px}
th,td{padding:10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child,th.l,td.l{text-align:left}
th{font-size:14px;color:var(--mut);font-weight:600;background:var(--bg)}
tr:nth-child(even) td{background:color-mix(in srgb,var(--bg) 45%,transparent)}
tr.cur td{background:color-mix(in srgb,var(--gold) 24%,transparent)}
.pos{color:var(--good);font-weight:700}.neg{color:var(--bad);font-weight:700}
.note{font-size:14px;color:var(--mut)}
.pill{font-size:13px;font-weight:600;padding:3px 12px;border-radius:99px;background:var(--bg);border:1px solid var(--line)}
.pill.ok{background:color-mix(in srgb,var(--good) 18%,transparent);border-color:var(--good)}
.pill.warn{background:color-mix(in srgb,var(--gold) 28%,transparent);border-color:var(--gold)}
.av{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:50%;color:#fff;font-size:13px;font-weight:700;margin-right:8px;vertical-align:middle}
.calc{background:var(--bg);border-left:5px solid var(--gold);border-radius:12px;padding:12px 14px;margin:12px 0}
.calc div{display:flex;justify-content:space-between;gap:12px;padding:3px 0}.calc b{font-size:18px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--card);padding:12px 18px;border-radius:12px;max-width:92vw;z-index:30;box-shadow:var(--sh)}
.toast[hidden]{display:none}
@media (max-width:700px){h1{font-size:24px}
 nav{position:fixed;left:0;right:0;bottom:0;margin:0;gap:0;background:var(--card);border-top:1px solid var(--line);z-index:20;padding-bottom:env(safe-area-inset-bottom,0px)}
 nav button{flex:1;flex-direction:column;gap:2px;border-radius:0;border:0;box-shadow:none;padding:8px 2px;font-size:12px;background:transparent;color:var(--mut)}
 nav button i{font-size:20px}nav button.on{background:transparent;color:var(--acc);border-top:3px solid var(--acc)}}
</style></head><body><main>
<header class="hero"><div class="top"><div class="brand"><span class="logo">🪙</span><h1 id="ttl"></h1></div>
<div class="ctl"><span class="badge" id="role"></span><label for="lang" id="llab" class="sr"></label><select id="lang"><option value="en">English</option><option value="te">తెలుగు</option></select><button id="theme" aria-label="theme">◐</button><button id="out" data-act="signout" hidden></button></div></div>
<p class="sub" id="sub"></p><div id="prog"></div></header>
<nav id="nav"></nav>
<div id="view"></div>
<div class="toast" id="toast" hidden role="status"></div>
</main>

 <div class="card"><h2>${t('withAcc')}</h2><p class="note">${t('mHelp')}</p><input id="q" placeholder="${t('srch')}"><div id="sr" style="margin-top:8px"></div></div>`;
 return h}
function vSetup(){const c=CFG||{name:T.en.app,n:20,amt:500000,min:110000,max:200000,full:false};
 return `<div class="card"><h2>${t('setT')}</h2><div class="grid"><div><label>${t('fName')}</label><input id="f_name" value="${esc(c.name)}"></div><div><label>${t('fN')}</label><input id="f_n" type="number" min="2" max="100" value="${c.n}"></div><div><label>${t('fAmt')}</label><input id="f_amt" type="number" value="${c.amt}"></div><div><label>${t('fDur')}</label><input id="f_dur" disabled value="${c.n}"></div><div><label>${t('fMin')}</label><input id="f_min" type="number" value="${c.min}"></div><div><label>${t('fMax')}</label><input id="f_max" type="number" value="${c.max}"></div></div>
 
 <div class="row"><button class="p" data-act="save">${t('save')}</button>${CFG?`<button class="d" data-act="reset">${t('reset')}</button>`:''}</div></div>`}
function vAudit(){const loc=LANG==='te'?'te-IN':'en-IN';
 return `<div class="card"><h2>${t('audT')}</h2><div class="wrap"><table><tr><th class="l">${t('when')}</th><th class="l">${t('by')}</th><th class="l">${t('what')}</th><th class="l">${t('det')}</th></tr>${AUD.map(a=>`<tr><td class="l">${new Date(a.ts).toLocaleString(loc)}</td><td class="l">${esc(a.byName||'')}</td><td class="l">${t(a.a)}</td><td class="l">${esc(a.x||'')}</td></tr>`).join('')||`<tr><td class="l note" colspan="4">${t('noAud')}</td></tr>`}</table></div></div>`}
function showSR(){const e=$('sr');if(!e)return;const ids=SR.filter(p=>!MEM[p.id]);e.innerHTML=ids.map(p=>`<div class="row" style="padding:4px 0"><span style="flex:1">${esc(p.name)} <span class="note">${esc(p.email||'')}</span></span><button class="p" data-act="add" data-id="${p.id}" data-name="${esc(p.name)}">${t('add')}</button></div>`).join('')||($('q')&&$('q').value?`<p class="note">${t('noRes')}</p>`:'')}
/* ---------- Actions ---------- */
const need=()=>{if(!ADMIN){toast(t('eperm'));return false}return true};
async function declare(w,d){if(!need())return;if(!tixOK()){toast(t('etick',{n:CFG.n,a:tixUsed()}));return}if(!confirm(t('cDecl',{n:nm(w),a:inr(d)})))return;
 const k=MON.length+1;await W(async()=>{await db.doc('months/m'+String(k).padStart(2,'0')).set({k,w,d,ts:Date.now()});for(const id of Object.keys(BIDS))await db.doc('bids/'+id).delete();await audit('a_win','#'+k+' '+nm(w)+' '+inr(d))})}
document.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;
 if(b.dataset.tab){tab=b.dataset.tab;location.hash=tab;render();return}
 const a=b.dataset.act,id=b.dataset.id;if(!a)return;
 if(a==='mybid'){const v=+$('mybid').value;if(!(v>=CFG.min&&v<=CFG.max)){toast(t('ebid',{min:inr(CFG.min),max:inr(CFG.max)}));return}
  if(await W(()=>db.doc('bids/'+ME.id).set({m:MON.length+1,amt:v,ts:Date.now()})))toast(t('saved'));return}
 if(a==='declare'){const vb=validBids();if(!vb.length){toast(t('enob'));return}const top=vb.filter(x=>x.d===vb[0].d);
  if(top.length>1&&!confirm(t('cTie',{c:top.length,a:inr(vb[0].d)})))return;const w=top[Math.floor(Math.random()*top.length)];return declare(w.id,w.d)}
 if(a==='manual'){const w=$('mm').value,v=+$('ma').value;if(!w||!(v>=CFG.min&&v<=CFG.max)){toast(t('ebid',{min:inr(CFG.min),max:inr(CFG.max)}));return}return declare(w,v)}
 if(a==='final'){if(!need())return;if(!tixOK()){toast(t('etick',{n:CFG.n,a:tixUsed()}));return}const w=eligible()[0].id,k=MON.length+1;return W(async()=>{await db.doc('months/m'+String(k).padStart(2,'0')).set({k,w,d:0,ts:Date.now()});await audit('a_win','#'+k+' '+nm(w)+' '+inr(0))})}
 if(a==='undo'){if(!need()||!confirm(t('cUndo')))return;const m=MON[MON.length-1];return W(async()=>{await db.doc('months/m'+String(m.k).padStart(2,'0')).delete();await audit('a_undo','#'+m.k)})}
 if(a==='reset'){if(!need()||!confirm(t('cReset')))return;return W(async()=>{for(const m of MON)await db.doc('months/m'+String(m.k).padStart(2,'0')).delete();for(const i of Object.keys(BIDS))await db.doc('bids/'+i).delete();await audit('a_reset')})}
 if(a==='save'){if(!need())return;const c={name:$('f_name').value.trim()||T.en.app,n:Math.max(2,Math.min(100,parseInt($('f_n').value)||20)),amt:+$('f_amt').value||0,min:+$('f_min').value||0,max:+$('f_max').value||0,full:false};
  if(c.max<c.min){toast(t('emm'));return}if(CFG&&MON.length&&(c.n!==CFG.n||c.amt!==CFG.amt)){toast(t('elock'));return}
  if(await W(async()=>{await db.doc('config/chit').set(c);await audit('a_setup',c.n+' / '+inr(c.amt)+' / '+inr(c.min)+'-'+inr(c.max))})){toast(t('ok'));tab='dash';render()}return}
 if(a==='add'||a==='addname'){if(!need())return;
  let nid=id,name=b.dataset.name,sh=1;
  if(a==='addname'){name=$('nn').value.trim();sh=parseInt($('nt').value)||1;nid=crypto.randomUUID();if(!name){toast(t('ename'));return}}
  else if(MEM[id]){toast(t('edup'));return}
  if(sh<1||tixUsed()+sh>CFG.n){toast(t('etixover',{n:CFG.n}));return}
  const no=Math.max(0,...reg().map(r=>r.no))+1;
  if(await W(async()=>{await db.doc('members/'+nid).set({name:name,shares:sh,no:no,active:true,ts:Date.now()});await audit('a_add',name+' x'+sh)})&&a==='addname'){$('nn').value=''}return}
 if(a==='toggle'){if(!need())return;const m=MEM[id];return W(async()=>{await db.doc('members/'+id).update({active:!m.active});await audit(m.active?'a_off':'a_on',m.name)})}
 if(a==='rm'){if(!need())return;if(won().includes(id)){toast(t('ewon'));return}if(!confirm(t('cRm',{n:nm(id)})))return;const n=nm(id);return W(async()=>{await db.doc('members/'+id).delete();await audit('a_rm',n)})}});
document.addEventListener('change',e=>{const el=e.target,c=el.dataset&&el.dataset.chg;if(!c)return;if(!need()){render();return}const id=el.dataset.id;
 if(c==='name'){const v=el.value.trim();if(!v){render();return}const old=nm(id);W(async()=>{await db.doc('members/'+id).update({name:v});await audit('a_edit',old+' -> '+v)})}
 if(c==='shares'){const v=parseInt(el.value),w=MON.filter(m=>m.w===id).length;
  if(!(v>=Math.max(1,w))){toast(t('etixlow'));render();return}
  if(tixUsed()-((MEM[id]||{}).shares||1)+v>CFG.n){toast(t('etixover',{n:CFG.n}));render();return}
  W(async()=>{await db.doc('members/'+id).update({shares:v});await audit('a_tix',nm(id)+' x'+v)})}});
document.addEventListener('input',async e=>{if(e.target.id==='q'&&sb&&ADMIN){const q=e.target.value.trim();if(!q){SR=[];showSR();return}try{const r=await sb.from('profiles').select('id,name,email').or('name.ilike.%'+q.replace(/[%,()]/g,'')+'%,email.ilike.%'+q.replace(/[%,()]/g,'')+'%').limit(10);SR=r.data||[]}catch(_){SR=[]}showSR()}});
$('lang').onchange=async e=>{LANG=e.target.value;try{localStorage.setItem('sr_lang',LANG)}catch(_){}render();if(db&&ME)W(()=>db.collection('data/users/'+ME.id).doc('prefs').set({lang:LANG}))};
$('theme').onclick=()=>{const r=document.documentElement;r.dataset.theme=getComputedStyle(r).getPropertyValue('--bg').trim()==='#0a1424'?'light':'dark'};
addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(['dash','bid','mem','setup','audit'].includes(h)){tab=h;render()}});
/* ---------- Supabase connection: fill in these two values (see README) ---------- */
const SUPABASE_URL=(window.SR_CONFIG&&window.SR_CONFIG.url)||'PASTE_PROJECT_URL_HERE';
const SUPABASE_KEY=(window.SR_CONFIG&&window.SR_CONFIG.key)||'PASTE_PUBLIC_ANON_KEY_HERE';
const sb=(window.supabase&&/^https?:/.test(SUPABASE_URL))?window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY):null;
/* Small adapter: the app talks to "db"; this maps it onto one Supabase table (public.docs) */
const subs=new Set();let tmr=0;const bump=()=>{clearTimeout(tmr);tmr=setTimeout(()=>subs.forEach(f=>f()),150)};
function chk(r){if(r.error){const e=new Error(r.error.message);e.code=(r.error.code==='42501'||/row-level security/i.test(r.error.message))?'not_granted':'unavailable';throw e}return r}
async function getDoc(c,id){const r=chk(await sb.from('docs').select('data').eq('coll',c).eq('id',id).maybeSingle());return r.data?r.data.data:null}
function ref(c,id){return{id,
 async get(){const d=await getDoc(c,id);return{exists:!!d,id,data:()=>d||undefined}},
 async set(d){chk(await sb.from('docs').upsert({coll:c,id,data:d}))},
 async update(d){const cur=await getDoc(c,id);chk(await sb.from('docs').upsert({coll:c,id,data:{...(cur||{}),...d}}))},
 async delete(){chk(await sb.from('docs').delete().eq('coll',c).eq('id',id))},
 onSnapshot(cb){const f=async()=>{try{const d=await getDoc(c,id);cb({exists:!!d,data:()=>d||undefined})}catch(_){}};subs.add(f);f();return()=>subs.delete(f)}}}
function coll(c){let fld=null,dir='asc',lim=1000;const q={doc:id=>ref(c,id),
 async add(d){chk(await sb.from('docs').insert({coll:c,id:crypto.randomUUID(),data:d}))},
 orderBy(f,d){fld=f;dir=d||'asc';return q},limit(n){lim=n;return q},
 onSnapshot(cb){const f=async()=>{try{const r=chk(await sb.from('docs').select('id,data').eq('coll',c).limit(1000));const rows=r.data.map(x=>({id:x.id,data:()=>x.data}));if(fld)rows.sort((a,b)=>((a.data()[fld]>b.data()[fld])?1:-1)*(dir==='desc'?-1:1));cb({docs:rows.slice(0,lim)})}catch(_){}};subs.add(f);f();return()=>subs.delete(f)}};return q}
const dbShim={doc:p=>{const a=p.split('/');return ref(a[0],a[1])},collection:p=>p.startsWith('data/users/')?{doc:()=>ref('prefs',p.split('/')[2])}:coll(p)};
/* ---------- Sign-in ---------- */
function loginView(){return `<div class="card" style="max-width:420px;margin:0 auto"><h2>${t('login')}</h2><div class="grid" style="grid-template-columns:1fr"><div><label>${t('yname')}</label><input id="nm" autocomplete="name"></div><div><label>${t('email')}</label><input id="em" type="email" autocomplete="username"></div><div><label>${t('pw')}</label><input id="pw" type="password" autocomplete="current-password"></div></div><div class="row" style="margin-top:12px"><button class="p" data-act="login">${t('login')}</button><button data-act="signup">${t('signup')}</button></div></div>`}
document.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b||!sb)return;const a=b.dataset.act;
 if(a==='signout'){await sb.auth.signOut();return}
 if(a==='login'||a==='signup'){const em=$('em').value.trim(),pw=$('pw').value;
  if(a==='login'){if(!em||!pw){toast(t('eauth'));return}const r=await sb.auth.signInWithPassword({email:em,password:pw});if(r.error)toast(t('eauth'))}
  else{if(!em||pw.length<8){toast(t('epw'));return}const r=await sb.auth.signUp({email:em,password:pw,options:{data:{name:$('nm').value.trim()}}});if(r.error)toast(r.error.message);else if(!r.data.session)toast(t('econf'))}}});
/* ---------- Boot ---------- */
let rq=0,started=false;const soft=()=>{cancelAnimationFrame(rq);rq=requestAnimationFrame(()=>{const a=document.activeElement;if(a&&a.matches&&a.matches('#view input,#view select'))return;render()})};
async function init(u){if(started)return;started=true;
 ME={id:u.id,name:(u.user_metadata&&u.user_metadata.name)||u.email||''};
 try{const p=await sb.from('profiles').select('name').eq('id',u.id).maybeSingle();if(p.data&&p.data.name)ME.name=p.data.name}catch(_){}
 try{const a=await sb.from('admins').select('user_id').eq('user_id',u.id).maybeSingle();ADMIN=!!a.data}catch(_){}
 db=dbShim;signedOut=false;
 try{const p=await db.collection('data/users/'+ME.id).doc('prefs').get();if(p.exists&&T[p.data().lang]){LANG=p.data().lang;try{localStorage.setItem('sr_lang',LANG)}catch(_){}}}catch(_){}
 const h=location.hash.slice(1);if(['dash','bid','mem','setup','audit'].includes(h))tab=h;
 const err=()=>{};
 db.doc('config/chit').onSnapshot(s=>{CFG=s.exists?s.data():null;ready=true;soft()});
 db.collection('members').onSnapshot(q=>{MEM={};q.docs.forEach(d=>MEM[d.id]=d.data());soft()});
 db.collection('months').onSnapshot(q=>{MON=q.docs.map(d=>d.data()).sort((a,b)=>a.k-b.k);soft()});
 db.collection('bids').onSnapshot(q=>{BIDS={};q.docs.forEach(d=>BIDS[d.id]=d.data());soft()});
 if(ADMIN)db.collection('audit').orderBy('ts','desc').limit(200).onSnapshot(q=>{AUD=q.docs.map(d=>d.data());soft()});
 sb.channel('docs-live').on('postgres_changes',{event:'*',schema:'public',table:'docs'},bump).subscribe();
 setInterval(bump,20000);setTimeout(()=>{ready=true;soft()},2500);render()}
(()=>{try{const s=localStorage.getItem('sr_lang');if(s&&T[s])LANG=s}catch(_){}
 $('lang').value=LANG;render();
 if(!sb)return;
 sb.auth.onAuthStateChange((ev,s)=>{if(ev==='SIGNED_OUT'){location.reload();return}
  if(s&&s.user&&!started)setTimeout(()=>init(s.user),0);
  else if(ev==='INITIAL_SESSION'&&!s){signedOut=true;render()}});
})();
</script></body></html>
